<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 둥근 사각 컨테이너 -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#cyanPurple)" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- AI 브레인 & 서킷 회로망 -->
  <g filter="url(#neonGlow)">
    <!-- 두뇌 윤곽선 (기하학적 폴리곤) -->
    <path d="M64 24 C44 24 30 38 30 58 C30 72 38 84 50 90 L52 102 L64 102 L64 92 C64 92 78 92 88 82 C96 74 98 62 98 56 C98 38 84 24 64 24 Z" 
          fill="none" stroke="url(#cyanPurple)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 내부 회로 연결선 -->
    <path d="M42 46 L54 52 L54 66 L42 74" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M86 46 L74 52 L74 66 L86 74" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
    <path d="M64 28 L64 42" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M64 78 L64 92" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>

    <!-- 회로 노드 (원형 점) -->
    <circle cx="42" cy="46" r="3" fill="#38bdf8"/>
    <circle cx="42" cy="74" r="3" fill="#38bdf8"/>
    <circle cx="86" cy="46" r="3" fill="#c084fc"/>
    <circle cx="86" cy="74" r="3" fill="#c084fc"/>
    <circle cx="64" cy="28" r="3" fill="#38bdf8"/>

    <!-- 중앙 다이아몬드 (최고의 가치 & 최저가 보석 심볼) -->
    <polygon points="64,44 76,58 64,74 52,58" fill="url(#goldAccent)" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <!-- 다이아몬드 상단 커팅선 -->
    <line x1="56" y1="52" x2="72" y2="52" stroke="#ffffff" stroke-width="1.2" opacity="0.9"/>
    <line x1="64" y1="44" x2="64" y2="74" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- 중심 광채 스파크 -->
  <circle cx="64" cy="58" r="2.5" fill="#ffffff"/>
</svg>
